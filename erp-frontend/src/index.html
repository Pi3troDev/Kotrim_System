<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Kotrim — o sistema que organiza sua oficina mecânica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#011c63" />
    <meta
      name="description"
      content="Ordens de serviço, clientes, veículos, estoque, financeiro e agenda em um só lugar. Feito para oficinas brasileiras. Teste 7 dias grátis, sem cartão."
    />
    <link rel="icon" type="image/x-icon" href="/brand/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo carries the headings (a squared grotesque that echoes the
         logo's own wordmark); Inter carries body text and the whole ERP. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/brand/kotrim-mark-64.webp" type="image/webp" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      // Applied before Angular bootstraps to avoid a light/dark flash on load.
      (function () {
        var stored = localStorage.getItem('kotrim-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark-theme');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
