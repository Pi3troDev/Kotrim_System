<figure class="area">
  @if (title()) {
    <figcaption class="area__head">
      <h3 class="area__title">{{ title() }}</h3>
      @if (subtitle()) {
        <p class="area__subtitle">{{ subtitle() }}</p>
      }
    </figcaption>
  }

  <div class="area__plot">
    <svg [attr.viewBox]="viewBox" class="area__svg" role="img" [attr.aria-label]="title()">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.22" />
          <stop offset="100%" stop-color="var(--primary)" stop-opacity="0" />
        </linearGradient>
      </defs>

      @for (y of gridLines(); track y) {
        <line [attr.x1]="12" [attr.y1]="y" [attr.x2]="628" [attr.y2]="y" class="area__grid" />
      }

      @if (areaPath()) {
        <path [attr.d]="areaPath()" fill="url(#areaFill)" />
        <path [attr.d]="linePath()" class="area__line" />
      }

      @for (p of points(); track p.point.label) {
        <circle [attr.cx]="p.x" [attr.cy]="p.y" r="3" class="area__dot" />
      }

      @if (hovered(); as h) {
        <line [attr.x1]="h.x" [attr.y1]="plotTop" [attr.x2]="h.x" [attr.y2]="plotBottom" class="area__cursor" />
        <circle [attr.cx]="h.x" [attr.cy]="h.y" r="5" class="area__dot area__dot--active" />
      }

      <!-- Invisible hit columns: hovering a 3px dot is a nuisance. -->
      @for (p of points(); track p.point.label; let i = $index) {
        <rect
          [attr.x]="p.x - hitWidth() / 2"
          [attr.y]="plotTop"
          [attr.width]="hitWidth()"
          [attr.height]="plotBottom - plotTop"
          class="area__hit"
          (mouseenter)="onEnter(i)"
          (mouseleave)="onLeave()"
        />
      }

      @for (p of points(); track p.point.label; let i = $index) {
        @if (showLabel(i)) {
          <text [attr.x]="p.x" [attr.y]="plotBottom + 18" class="area__label">{{ p.point.label }}</text>
        }
      }
    </svg>

    @if (hovered(); as h) {
      <div class="area__tip" [style.left.%]="(h.x / 640) * 100">
        <span class="area__tip-label">{{ h.point.label }}</span>
        <span class="area__tip-value">{{ formatValue(h.point.value) }}</span>
      </div>
    }
  </div>
</figure>
