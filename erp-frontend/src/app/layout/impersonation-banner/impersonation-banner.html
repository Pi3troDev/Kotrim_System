@if (isImpersonating()) {
  <div class="imp" role="status">
    <div class="imp__inner">
      <mat-icon class="imp__icon">visibility</mat-icon>

      <span class="imp__text">
        Modo suporte — você está vendo
        <strong>{{ companyName() }}</strong>
        como
        <strong>{{ session()?.user?.name }}</strong>
        <span class="imp__ro">somente leitura</span>
      </span>

      <button mat-flat-button type="button" class="imp__exit" (click)="exit()">
        <mat-icon>logout</mat-icon>
        Sair da visualização
      </button>
    </div>
  </div>
}
