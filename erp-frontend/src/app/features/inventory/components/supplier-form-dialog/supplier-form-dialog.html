<h2 mat-dialog-title>{{ isEditMode ? 'Editar fornecedor' : 'Novo fornecedor' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="supplier-form">
    <mat-form-field appearance="outline" class="supplier-form__field supplier-form__field--full">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" autocomplete="organization" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Informe o nome do fornecedor.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="supplier-form__field">
      <mat-label>CPF/CNPJ</mat-label>
      <input matInput formControlName="document" appDigitMask="cpfCnpj" inputmode="numeric" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="supplier-form__field">
      <mat-label>Telefone</mat-label>
      <input matInput formControlName="phone" appDigitMask="phone" inputmode="numeric" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="supplier-form__field supplier-form__field--full">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.hasError('email')) {
        <mat-error>E-mail inválido.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="supplier-form__field supplier-form__field--full">
      <mat-label>Endereço</mat-label>
      <input matInput formControlName="address" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="supplier-form__field supplier-form__field--full">
      <mat-label>Observações</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ isEditMode ? 'Salvar alterações' : 'Criar fornecedor' }}
      }
    </button>
  </mat-dialog-actions>
</form>
