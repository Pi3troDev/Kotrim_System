<h2 mat-dialog-title>Alterar status</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="status-form">
    <p class="status-form__current">
      Status atual: <strong>{{ statusMeta[data.currentStatus].label }}</strong>
    </p>

    <mat-form-field appearance="outline" class="status-form__field">
      <mat-label>Novo status</mat-label>
      <mat-select formControlName="status">
        @for (status of availableStatuses; track status) {
          <mat-option [value]="status">{{ statusMeta[status].label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="status-form__field">
      <mat-label>Observação (opcional)</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Confirmar
      }
    </button>
  </mat-dialog-actions>
</form>
