<h2 mat-dialog-title>Editar ordem de serviço</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="details-form">
    <mat-form-field appearance="outline" class="details-form__field">
      <mat-label>Problema relatado</mat-label>
      <textarea matInput formControlName="reportedProblem" rows="2"></textarea>
      @if (form.controls.reportedProblem.hasError('required')) {
        <mat-error>Descreva o problema relatado.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="details-form__field">
      <mat-label>Diagnóstico</mat-label>
      <textarea matInput formControlName="diagnosis" rows="2"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="details-form__field">
      <mat-label>Observações</mat-label>
      <textarea matInput formControlName="observations" rows="2"></textarea>
    </mat-form-field>

    <div class="details-form__row">
      <mat-form-field appearance="outline" class="details-form__field">
        <mat-label>Desconto (R$)</mat-label>
        <input matInput type="number" step="0.01" formControlName="discountAmount" min="0" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="details-form__field">
        <mat-label>Garantia (dias)</mat-label>
        <input matInput type="number" formControlName="warrantyDays" min="0" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Salvar alterações
      }
    </button>
  </mat-dialog-actions>
</form>
